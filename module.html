<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module — DocSearch</title>
    <!-- Voir index.html pour l'explication de ce script anti-flash. -->
    <script>
      try {
        var scheme = localStorage.getItem('vue-dsfr-scheme') || 'system'
        var theme =
          scheme === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : scheme
        document.documentElement.setAttribute('data-fr-theme', theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/pages/module/main.ts"></script>
  </body>
</html>
