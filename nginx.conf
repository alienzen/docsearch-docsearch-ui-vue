worker_processes auto;
events { worker_connections 1024; }

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;

    # L'API est résolue par le nom de service Docker "api" — les
    # conteneurs doivent être sur le même réseau Docker.
    #
    # ⚠️ Nginx résout ce nom AU DÉMARRAGE et garde l'adresse. Après
    # recréation du conteneur d'API, celui-ci doit être redémarré à son
    # tour, sinon il pointe vers une IP qui n'existe plus.
    #
    # SYMPTÔME PARTICULIER ICI, et il ne ressemble pas à ce qu'il est :
    # toutes les pages répondent **500**, pas 502. La sous-requête
    # `auth_request` échoue en 502, et nginx traduit tout statut de
    # sous-requête autre que 2xx/401/403 en 500 côté client. On croit à un
    # bug applicatif ; c'est une adresse périmée. La vraie cause est dans
    # le journal du conteneur :
    #   journalctl -u docsearch-ui-vue | grep "auth request"
    #   → connect() failed (113: Host is unreachable) ... subrequest: "/_access_check"
    #
    # D'où l'ORDRE de redémarrage, du bas vers le haut de la chaîne :
    #   docsearch-api → docsearch-ui-vue → docsearch-dev-user-proxy
    upstream api_backend {
        server api:8000;
    }

    server {
        listen 80;
        # ⚠️  À NOMMER avant toute mise en service du SSO Kerberos : le
        # navigateur dérive le SPN du nom d'hôte de l'URL appelée
        # (HTTP/<fqdn>), et ni Chrome ni Firefox ne tentent Negotiate
        # contre une adresse IP littérale. Voir PLAN-AUTH-SSO.md §2.5a.
        server_name _;

        # Un ticket Kerberos d'Active Directory transporte le PAC, donc
        # tous les SID de groupes du compte : l'en-tête
        # "Authorization: Negotiate" dépasse couramment 8 Ko sur un
        # utilisateur à nombreux groupes, et Nginx répond alors
        # "400 Request Header Or Cookie Too Large" SANS RIEN JOURNALISER
        # d'explicite. À poser dans le bloc `server` : l'analyse des
        # en-têtes précède le choix du `location`.
        #
        # Deux étages plafonnent la même chose et LE PLUS BAS GAGNE : ce
        # réglage ne vaut que de pair avec --h11-max-incomplete-event-size
        # côté uvicorn (voir le Dockerfile de docsearch-api). Les relever
        # ensemble, ou ne rien relever.
        #
        # NE PAS ajouter proxy_buffer_size / proxy_buffers « pour faire
        # bonne mesure » : ces directives concernent la RÉPONSE, pas la
        # requête, et proxy_buffer_size posé seul fait REFUSER NGINX DE
        # DÉMARRER (proxy_busy_buffers_size vaut le double par défaut et
        # doit rester sous « tous les proxy_buffers moins un »).
        large_client_header_buffers 8 32k;

        # Redirections RELATIVES (Location: /connexion?next=…) et non
        # absolues. Sans cette ligne, nginx fabrique une URL complète à
        # partir de `$host` et du port sur lequel IL écoute — 80 dans le
        # conteneur. Le navigateur, arrivé par le proxy de recette
        # (192.168.56.101:8090) ou par le reverse-proxy TLS, se verrait
        # renvoyer vers `http://192.168.56.101/connexion` : mauvais port,
        # mauvais protocole, connexion refusée. Une Location relative est
        # résolue par le navigateur contre l'origine courante, qui est la
        # bonne dans les trois cas (8080 direct, 8090, HTTPS).
        absolute_redirect off;

        # Les PAGES ne sont pas mises en cache ; les assets, si (voir
        # /assets/ plus bas, qui redéfinit cet en-tête et l'emporte donc).
        #
        # C'est le pendant obligatoire des noms de fichiers hachés : à
        # chaque reconstruction, index.html référence de NOUVEAUX hachages
        # et les anciens fichiers disparaissent. Un navigateur qui garde
        # l'ancienne page en cache réclame alors des assets qui n'existent
        # plus — page blanche, sans erreur lisible, jusqu'à un
        # rechargement forcé que personne ne pense à faire. Le piège s'est
        # produit pendant la recette de cette authentification : un onglet
        # servait encore l'ancien bundle après reconstruction de l'image.
        add_header Cache-Control "no-cache" always;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Contrôle d'accès — toutes les pages ────────────────
        # Chaque page exige une session valide ET l'appartenance à
        # ACCESS_GROUP. La vérification est faite côté API (seule à
        # pouvoir vérifier la signature du jeton et interroger LDAP) via
        # cette sous-requête interne ; Nginx ne fait que propager son
        # code 200/401/403.
        #
        # C'EST LA RAISON D'ÊTRE DU BUILD MULTI-PAGES : chaque page reste
        # un fichier physique distinct, donc protégeable individuellement.
        # Une SPA à point d'entrée unique aurait imposé un fallback
        # "try_files ... /index.html" qui aurait servi le HTML
        # d'administration à tout le monde.
        #
        # ⚠️  CE QUI A CHANGÉ : la sous-requête relayait autrefois
        # `X-User $http_x_user`, c'est-à-dire un en-tête posé par le
        # CLIENT. N'importe qui pouvait donc s'annoncer administrateur.
        # Elle relaie désormais le cookie de session, que seule
        # l'application peut avoir émis et qu'elle vérifie elle-même.
        # Ne jamais réintroduire la ligne X-User ici.
        location = /_access_check {
            internal;
            proxy_pass          http://api_backend/auth/check-access;
            proxy_pass_request_body off;
            proxy_set_header    Content-Length "";
            proxy_set_header    Cookie $http_cookie;
        }

        # /admin exige en plus ADMIN_GROUP (docsearch-admins), pas
        # seulement ACCESS_GROUP.
        location = /_admin_check {
            internal;
            proxy_pass          http://api_backend/auth/check-admin;
            proxy_pass_request_body off;
            proxy_set_header    Content-Length "";
            proxy_set_header    Cookie $http_cookie;
        }

        # Sans session, l'échec du auth_request donnerait une page
        # d'erreur nue. On renvoie au formulaire, en gardant la
        # destination demandée pour y revenir une fois connecté.
        #
        # 403 volontairement ABSENT : un membre de l'annuaire qui n'est
        # pas dans ACCESS_GROUP est authentifié — le renvoyer au
        # formulaire le ferait boucler sur une connexion qui réussit et
        # une page qui refuse. Il doit voir le 403.
        error_page 401 = @connexion;
        location @connexion {
            return 302 /connexion?next=$request_uri;
        }

        # ── Page de connexion — la seule page PUBLIQUE ─────────
        # Pas de auth_request : c'est la page qui permet d'en obtenir
        # une. Elle ne divulgue rien — le formulaire et la tentative SSO.
        location = /connexion {
            try_files /connexion.html =404;
        }
        location = /connexion.html {
            try_files /connexion.html =404;
        }

        # Les deux images que l'en-tête de cette page demande. Même raison
        # que /assets/ ci-dessous : gardées, elles laisseraient un
        # bloc-marque cassé sur l'écran de connexion. Le reste de public/
        # (Bloc_Marianne.svg, bloc-acp-rvb.png, custom-sources.*) n'est
        # référencé que par des pages authentifiées et reste protégé.
        location = /favicon.svg {
            try_files $uri =404;
        }
        location = /logo-docsearch.svg {
            try_files $uri =404;
        }

        # ── Routes d'authentification ─────────────────────────
        # ⚠️  L'en-tête `Authorization` (ticket SPNEGO) traverse PAR
        # DÉFAUT ; les proxy_set_header ci-dessous n'en retirent aucun. Un
        # `proxy_pass_request_headers off;` ajouté « pour faire propre »
        # couperait la connexion automatique sans autre symptôme qu'un
        # 401 inexplicable.
        location /auth/ {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Modules complémentaires ───────────────────────────
        # Un fragment par module à capacité `service_web`, écrit par
        # « ./manage.sh plugin install » dans /etc/docsearch/nginx/plugins
        # et monté ici en lecture seule. Chacun déclare un
        # `location /ext/<nom>/`.
        #
        # Le joker qui ne correspond à rien n'est PAS une erreur nginx :
        # une installation sans aucun module démarre normalement.
        #
        # ⚠️  Pas d'`auth_request` ici, comme pour /search et les autres
        # routes d'API : c'est le module qui vérifie la session, en
        # validant le cookie contre le JWKS de l'API. Un `auth_request`
        # ajouté « pour faire propre » ne protégerait de toute façon que
        # le chemin passant par ce proxy — un module reste joignable
        # directement sur le réseau de la pile.
        include /etc/nginx/plugins/*.conf;

        # ── Pages ─────────────────────────────────────────────
        # Toutes les pages sont désormais servies depuis dist/ : le
        # repli vers l'interface historique (upstream ui_legacy) a été
        # retiré, la migration étant terminée.
        location / {
            auth_request /_access_check;
            try_files $uri $uri/ =404;
        }

        # Pages sans ".html" dans l'URL (/help plutôt que /help.html) —
        # try_files seul ne les trouve pas. stats.html n'a pas besoin de
        # bloc dédié : il n'est référencé qu'avec son extension, et
        # "location /" le sert directement depuis dist/.
        location = /help {
            auth_request /_access_check;
            try_files /help.html =404;
        }
        location = /chat {
            auth_request /_access_check;
            try_files /chat.html =404;
        }

        # Assets hashés par Vite : immuables, donc cachés longtemps.
        #
        # ⚠️  PAS de auth_request ici, et ce n'est pas un oubli. La page de
        # connexion est publique par nécessité — c'est elle qui permet
        # d'obtenir une session — et une page ne peut pas se rendre si son
        # JavaScript et ses polices, eux, exigent une session : le
        # navigateur reçoit alors la redirection HTML à la place du script,
        # et la page reste BLANCHE, sans la moindre erreur explicite.
        # Constaté au navigateur, réseau à l'appui : /assets/*.js →
        # 302 /connexion?next=/assets/…
        #
        # Ce que ça expose : du code client compilé et des polices. Les
        # données qu'il affiche viennent d'API qui, elles, vérifient la
        # session. Le auth_request qu'il y avait ici était de la défense en
        # profondeur, jamais une frontière de sécurité — et il rendait la
        # seule page publique du site inutilisable.
        location /assets/ {
            # Un seul add_header, pas de directive "expires" en plus :
            # les deux émettent chacun leur Cache-Control, et la réponse
            # en portait donc deux.
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files  $uri =404;
        }

        # /admin ET /admin.html : sans le second bloc, le fichier
        # physique serait joignable en contournant le premier et ne
        # serait protégé que par _access_check (docsearch-users) au lieu
        # de _admin_check (docsearch-admins).
        location = /admin {
            auth_request /_admin_check;
            try_files    /admin.html =404;
        }
        location = /admin.html {
            auth_request /_admin_check;
            try_files    /admin.html =404;
        }

        location = /admin-help {
            auth_request /_access_check;
            try_files    /admin-help.html =404;
        }

        # Les deux aides sont de simples pages de documentation : elles
        # n'exposent aucune donnée, d'où _access_check et non _admin_check.
        # Un non-administrateur qui suit le lien lit l'aide et se heurte au
        # refus sur /stats.html, ce qui est plus clair qu'un 401 sur l'aide.
        location = /stats-help {
            auth_request /_access_check;
            try_files    /stats-help.html =404;
        }

        # ── Proxy vers l'API ──────────────────────────────────
        # Doit rester le miroir des routes déclarées dans le proxy de
        # développement (vite.config.ts) : un chemin ajouté ici sans
        # l'être là-bas (ou l'inverse) donne un "marche en dev, 404 en
        # conteneur".
        location /search {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
            # Nécessaire pour la page de statistiques admin — sans ça,
            # l'API ne verrait que l'IP interne du conteneur.
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/(document|health)(/|$) {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        location /saved-searches {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        # Routes personnelles : ce que l'utilisateur courant a lui-même
        # fait (historique de recherche). Préfixe et non chemin exact —
        # c'est là que viendront les suivantes.
        location /me/ {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        location /alerts {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        location /collections {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        location ~ ^/(engagement-config|feedback|click|nps|suggestions)$ {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        location = /searchable-sources {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        location = /custom-facets {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        location = /ui-config {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        location = /is-admin {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        location /ask {
            proxy_pass          http://api_backend;
            proxy_read_timeout  120s;
        }

        location /metrics {
            proxy_pass          http://api_backend;
            proxy_http_version  1.1;
            proxy_set_header    Connection "";
            proxy_buffering     off;
        }

        location /api/preview/ {
            proxy_pass         http://api_backend;
            proxy_read_timeout 120s;
            proxy_buffering    off;
        }

        # Panneau d'administration — l'API applique elle-même son
        # contrôle d'accès (groupe LDAP admin).
        location /admin/ {
            proxy_pass         http://api_backend;
            proxy_set_header   Host $host;
            proxy_read_timeout 60s;
        }
    }
}
